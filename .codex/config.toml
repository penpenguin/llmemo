hide_agent_reasoning = true
model = "gpt-5.5"
model_reasoning_effort = "high"
network_access = true
personality = "pragmatic"
web_search = "live"

[features]
js_repl = true
multi_agent = true

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest", "--isolated=true", "--browserUrl=http://localhost:9222"]

[mcp_servers.serena]
command = "uvx"
args = ["--from", "git+https://github.com/oraios/serena", "serena", "start-mcp-server", "--context", "codex"]
