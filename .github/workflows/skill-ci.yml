name: Skill CI

on:
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skill-ci.yml'
      - 'scripts/validate_agent_skills.py'
      - 'tests/**'
  push:
    branches:
      - main
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skill-ci.yml'
      - 'scripts/validate_agent_skills.py'
      - 'tests/**'

permissions:
  contents: read

jobs:
  skill-guard:
    name: Validate agent skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate CI contract
        run: python3 -m unittest discover -s tests

      - name: Validate skill bundles
        run: python3 scripts/validate_agent_skills.py .agents/skills

      - name: Install test runner
        run: python3 -m pip install pytest

      - name: Run skill unit tests
        run: |
          set -euo pipefail
          found=0
          for pyproject in .agents/skills/*/pyproject.toml; do
            [ -e "$pyproject" ] || continue
            skill_dir="$(dirname "$pyproject")"
            if [ -d "$skill_dir/tests" ]; then
              found=1
              echo "Running tests in $skill_dir"
              python3 -m pytest "$skill_dir/tests" --rootdir "$skill_dir"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No skill unit tests found."
          fi
